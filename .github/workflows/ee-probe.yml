# Diagnostic: can CI reach Earth Engine with the service account? Safe to run anytime.
# target=v2 probes the pack v2 datasets (band names, scales, pyramids, pull cost).
name: Earth Engine probe
on:
  workflow_dispatch:
    inputs:
      target:
        description: "basic, v2 (datasets) or v2b (class method, HYCOM budget)"
        default: basic
        type: choice
        options: [basic, v2, v2b]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no moving major tag upstream
      - name: Probe Earth Engine
        env:
          EE_PROJECT: ${{ secrets.EE_PROJECT }}
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          TARGET: ${{ inputs.target }}
        run: uv run --quiet --with earthengine-api --with numpy python pipeline/scripts/ee_probe.py "$TARGET"
