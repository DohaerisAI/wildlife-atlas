# Tests every push, then rebuilds the living feature board and publishes it to GitHub Pages.
# The board is published even when tests fail, so broken features show up on it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no moving major tag upstream
      - name: Test pipeline
        working-directory: pipeline
        run: uv sync --quiet && uv run pytest -q --junitxml=../reports/pytest.xml --cov=atlas_pipeline --cov-report=term
      - name: Test board generator
        if: ${{ !cancelled() }}
        working-directory: tools/board
        run: uv run --quiet --with pytest --with pyyaml pytest -q test_build_board.py
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: report-pipeline
          path: reports/pytest.xml
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Type check
        working-directory: web
        run: npm run typecheck
      - name: Unit tests
        if: ${{ !cancelled() }}
        working-directory: web
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=../reports/vitest.xml
      - name: Build
        if: ${{ !cancelled() }}
        working-directory: web
        run: npx vite build
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: report-web
          path: reports/vitest.xml
          retention-days: 7

  board:
    needs: [pipeline, web]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}board/
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no moving major tag upstream
      - uses: actions/download-artifact@v8
        with:
          pattern: report-*
          path: reports
          merge-multiple: true
      - name: Build board
        run: uv run --quiet tools/board/build_board.py --features features --reports reports --out site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
