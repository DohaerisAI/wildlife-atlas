id: tile-engine
title: One engine, space to town (tiled globe)
layer: L3
status: building
summary: >-
  Decision 0010 prototype (engine.html): our own EPSG:4326 quadtree of sphere-patch tiles on the three.js globe,
  screen-space-error LOD with horizon and frustum culling, an LRU tile cache with a budget, the nearest loaded
  ancestor shown until children arrive (no holes), skirts against cracks, drawn by the Living Earth shader
  (class colour, canopy, hillshade, monthly NDVI) so the look matches the dot globe, which fades out as the
  surface fades in. Focus-first loading: one priority queue scored by distance from the focus (screen centre or the
  zoom anchor under the cursor), level and blur; stale requests aborted; prefetch one level finer around the focus
  and ahead of a flight; new tiles crossfade over the parent in 200 ms. Place labels from our GeoNames product with population priority, collision and fades. A
  camera from 25,000 km to 3 km with altitude-scaled pan and zoom and tight clip planes. Debug HUD.
paths:
