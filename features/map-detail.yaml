    file: src/atlas/locate.test.ts
  - suite: vitest
    file: src/engine/layers/cell-layer.test.ts
  - suite: vitest
    file: src/engine/tiles/lod.test.ts
next: >-
  Road rasters below ~50 km (plan step 4); observation clusters at local zoom where permitted.
