id: map-detail
title: Up close on the one engine, find a place, locate me
layer: L4
status: building
summary: >-
  The MapLibre street map is gone (decision 0010). The atlas zooms from space to ~3 km in one view on the tiled
  Living Earth engine: our place names appear by population as you come down, the followed species' range is a
  wash of its grid cells in its follow colour (below ~6,000 km), and the picked place is pinned with the ~110 km
  cell its species list covers outlined. Search and "Show on map" fly there; Locate me uses the browser's
  location only when asked, explains every failure and flies to town height. A Real colour toggle blends our
  Sentinel-2 true-colour mosaic in where tiles have it. Old ?map= links open at the same place.
paths:
  - web/src/atlas/globe.ts
  - web/src/engine/layers/cell-layer.ts
  - web/src/atlas/locate.ts
  - web/src/atlas/app.ts
checks:
