id: map-detail
title: Street map up close, find a place, locate me
layer: L4
status: building
summary: >-
  The old map page is gone. Inside the atlas, zooming in past ~1,300 km (or searching a place, or Locate me)
  crossfades to a dark MapLibre street map with town names; species richness is a faint wash, the followed
  species amber, the picked place pinned; zooming out hands back to the globe. Locate me uses the browser's
  location only when asked and explains every failure.
