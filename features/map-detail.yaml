id: map-detail
title: Street map up close, find a place, locate me
layer: L4
status: building
summary: >-
  The old map page is gone. Inside the atlas, zooming in past ~1,300 km (or searching a place, or Locate me)
  crossfades to a dark MapLibre street map with town names; species richness is a faint wash and the followed
  species amber, both drawn as one soft image blended between grid-cell centres (no square tiles), the picked place pinned; zooming out hands back to the globe. Locate me uses the browser's
  location only when asked and explains every failure. The Living Earth land look (class colours, this
  month's greenness, relief) is painted under the streets at globe tone, fading as you zoom in, so the
  hand-over feels like the same world. Hand-over: globe closer than 1,300 km (map zoom ~6); back below zoom 4.3.
paths:
  - web/src/atlas/map-view.ts
  - web/src/atlas/smooth-surface.ts
  - web/src/atlas/locate.ts
  - web/src/atlas/app.ts
checks:
