id: living-earth-tiles
title: Living Earth tile pyramids and place names
layer: L2
status: building
summary: >-
  Our own tile product for the one engine (decision 0010), same detail worldwide: levels 0-4 cut from pack v2;
  levels 5-8 (down to ~300 m) of ESA WorldCover class, MODIS tree cover, Copernicus DEM hillshade and 12 monthly
  MODIS NDVI, computed in Earth Engine as a matrix of level-3 shards that skips open ocean and resumes by
  rerunning failed shards. Town levels 9-11 (validation sites) add GLO-30 2024_1 hillshade at 30 m and a Sentinel-2
  true-colour mosaic; MODIS MOD13Q1 NDVI (250 m) stops at level 9 and the engine samples that tile's sub-rectangle at levels
  10-11 (manifest ndvi.levels). Each tileset has a manifest with sources and an availability index.
  Coast fix without a rebuild: a coast mask (GLO-30 WBM ocean share, level 8, coastal tiles only, coast.yml) patches
  near-shore WorldCover water to ocean in the served tiles and re-derives levels 5-7 (`atlas coast-patch`); world levels 0-4 are reduced from detail level 5 where it exists (`atlas world-from-detail`). Place names:
  GeoNames cities1000 worldwide (171k places), capitals and admin seats flagged, chunked by level-3 tile.
  Tiles are not in git: R2 hosting is blocked on the owner's Cloudflare account (docs/plans/one-engine.md).
paths:
  - pipeline/atlas_pipeline/tile_math.py
  - pipeline/atlas_pipeline/tile_raster.py
  - pipeline/atlas_pipeline/tile_product.py
  - pipeline/atlas_pipeline/tiles_ee.py
  - pipeline/atlas_pipeline/tiles_ee_fine.py
  - web/src/engine/tiles/tileset.ts
  - pipeline/atlas_pipeline/places.py
  - pipeline/scripts/tiles_ci.py
  - .github/workflows/tiles.yml
  - scripts/pull-tiles.sh
  - pipeline/atlas_pipeline/coast_mask.py
  - pipeline/atlas_pipeline/coast_patch.py
  - pipeline/atlas_pipeline/coast_ee.py
  - pipeline/scripts/coast_ci.py
  - pipeline/assets/coast-plan.json
  - .github/workflows/coast.yml
  - pipeline/atlas_pipeline/world_from_detail.py
